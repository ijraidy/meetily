# XcodeGen specification for the Minuteman iPhone app.
# Regenerate the Xcode project with:  cd ios && xcodegen generate
# The .xcodeproj is NOT committed; CI generates it on every run.
name: Minuteman

options:
  bundleIdPrefix: com.ijraidy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptySchemes: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_STRICT_CONCURRENCY: minimal
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  # WhisperKit now ships from the renamed "argmax-oss-swift" package
  # (github.com/argmaxinc/WhisperKit redirects here). The "WhisperKit" library
  # product still exists and is imported with `import WhisperKit`.
  # Pinned to the exact release tag v1.1.0 (verified against the GitHub tag list).
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0

targets:
  Minuteman:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Minuteman
        excludes:
          - "Info.plist"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Minuteman/Info.plist
      properties:
        CFBundleDisplayName: Minuteman
        CFBundleName: Minuteman
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ar
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Minuteman records meeting audio so it can be transcribed on this device."
        NSLocalNetworkUsageDescription: "Minuteman connects to your Minuteman desktop app on the local network to sync meetings."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # The desktop sync server is usually plain HTTP on a LAN or VPN.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ijraidy.minuteman.ios
        PRODUCT_NAME: Minuteman
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
    scheme:
      gatherCoverageData: false
